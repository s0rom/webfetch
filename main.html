<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebFetch</title>

  <style>
    :root {
      --font-mono: 'Hack Nerd Font', Monaco, Consolas, 'Courier New', Courier, monospace;
      --radius-window: 8px;
      --radius-modal: 8px;
      --radius-element: 4px;
      --padding-base: 20px;
      --header-height: 38px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-mono);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: var(--padding-base);
      transition: background-color 0.3s, color 0.3s;
    }

    ::-webkit-resizer,
    .webfetch-window::-webkit-resizer {
      display: none !important;
      background: transparent !important;
      appearance: none !important;
      opacity: 0 !important;
    }

    .webfetch-window {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-window);
      width: 800px;
      height: 440px;
      min-width: 380px;
      min-height: 220px;
      max-width: 95vw;
      max-height: 90vh;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      z-index: 100;
      background: transparent;
    }
    .resizer-tl { top: 0; left: 0; cursor: nwse-resize; }
    .resizer-tr { top: 0; right: 0; cursor: nesw-resize; }
    .resizer-bl { bottom: 0; left: 0; cursor: nesw-resize; }
    .resizer-br { bottom: 0; right: 0; cursor: nwse-resize; }

    .webfetch-window.window-style-linux {
      border-radius: var(--radius-element);
    }
    .webfetch-window.window-style-linux .window-header {
      display: none;
    }

    .window-header {
      background-color: var(--bg-element);
      padding: 0 0 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
      height: var(--header-height);
    }

    .mac-dots {
      display: flex;
      gap: 8px;
    }
    .mac-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    
    .win-controls {
      display: flex;
      align-items: center;
      height: 100%;
    }
    .win-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 46px;
      height: var(--header-height);
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
      transition: background 0.15s;
    }
    .win-btn:hover {
      background-color: var(--bg-element-hover);
    }
    .win-btn.close:hover {
      background-color: #e81123;
      color: #ffffff;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: var(--radius-element);
      transition: background 0.2s;
    }
    .menu-btn:hover {
      background-color: var(--bg-element-hover);
    }

    .floating-menu-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      z-index: 2;
    }
    .webfetch-window.window-style-linux .floating-menu-btn {
      display: block;
    }

    .window-body {
      padding: 25px;
      display: flex;
      gap: 30px;
      align-items: flex-start;
      overflow: auto;
      height: calc(100% - var(--header-height));
    }
    .webfetch-window.window-style-linux .window-body {
      height: 100%;
    }

    .logo-container pre {
      color: #c5c8c6;
      font-weight: bold;
      line-height: 1.2;
    }

    .info-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .title-line { font-weight: bold; }
    .separator {
      color: var(--border-color);
      margin-bottom: 4px;
    }

    .info-row {
      display: flex;
      gap: 10px;
    }

    .info-key {
      font-weight: bold;
      min-width: 90px;
    }

    .color-blocks {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .block {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: var(--padding-base);
      z-index: 99999;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-modal);
      width: 100%;
      max-width: 650px;
      padding: var(--padding-base);
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    .settings-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }
    .settings-group label {
      font-size: 12px;
      color: var(--text-muted);
    }

    select, textarea {
      background-color: var(--bg-element);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      outline: none;
    }
    select:focus, textarea:focus { border-color: var(--accent); }

    textarea {
      height: 220px;
      resize: vertical;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      align-items: center;
      padding-top: 5px;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-element);
      cursor: pointer;
      font-weight: bold;
      background-color: var(--bg-element);
      color: var(--btn-text-color, var(--text-main));
      transition: background 0.2s;
    }
    .btn:hover { background-color: var(--bg-element-hover); }

    .btn-save {
      background-color: var(--accent);
      color: var(--bg-main);
      border-color: var(--accent-border);
    }
    .btn-save:hover { background-color: var(--accent-hover); }

    .btn-combined {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
    }

    .btn-icon-file {
      width: 16px;
      height: 16px;
      object-fit: contain;
      flex-shrink: 0;
      filter: var(--icon-filter, none);
    }

    .btn-save .btn-icon-file {
      filter: none;
    }

    .btn-save span {
      color: var(--bg-main);
    }

    .auto-btn-margin {
      margin-left: auto;
    }
    .mac-title-spacing {
      margin-right: auto; 
      margin-left: 20px;
    }
    .mac-btn-spacing {
      margin-right: 5px;
    }
  </style>

  <script src="logos.js"></script>
  <link id="themeStyle" rel="stylesheet" href="themes/neutral.css">
</head>
<body>

  <div class="webfetch-window window-style-macos" id="webfetchWindow">
    <div class="window-header" id="windowHeader"></div>
    <button class="menu-btn floating-menu-btn" onclick="openModal()" title="Settings">⋮</button>

    <div class="window-body">
      <div class="logo-container" id="logoBox"></div>
      <div class="info-container" id="infoBox">Loading...</div>
    </div>

    <div class="resize-handle resizer-tl"></div>
    <div class="resize-handle resizer-tr"></div>
    <div class="resize-handle resizer-bl"></div>
    <div class="resize-handle resizer-br"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title">
        <span>WebFetch Settings</span>
      </div>

      <div class="settings-row">
        <div class="settings-group">
          <label for="themeSelect">Theme:</label>
          <select id="themeSelect">
            <option value="neutral">Neutral</option>
            <option value="blue">Blue</option>
            <option value="catppuccin">Catppuccin</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="gruvbox">Gruvbox</option>
            <option value="pink">Pink</option>
            <option value="red">Red</option>
            <option value="terminal">Terminal</option>
            <option value="yellow">Yellow</option>
          </select>
        </div>

        <div class="settings-group">
          <label for="windowStyleSelect">Terminal (OS):</label>
          <select id="windowStyleSelect">
            <option value="macos">macOS Style</option>
            <option value="windows">Windows Style</option>
            <option value="linux">Linux (without top)</option>
          </select>
        </div>
      </div>

      <div class="settings-group">
        <label for="configInput">JSON config:</label>
        <textarea id="configInput" spellcheck="false"></textarea>
      </div>

      <input type="file" id="fileInput" accept=".json" style="display: none;">

      <div class="modal-actions">
        <button class="btn btn-combined" id="exportBtn" title="Export Config to File">
          <img src="UI/export.svg" alt="Export" class="btn-icon-file">
          <span>Export</span>
        </button>
        <button class="btn btn-combined" id="importBtn" title="Import Config from File">
          <img src="UI/import.svg" alt="Import" class="btn-icon-file">
          <span>Import</span>
        </button>
        <button class="btn btn-combined auto-btn-margin" id="eraseBtn" title="Reset to default config">
          <img src="UI/erase.svg" alt="Erase" class="btn-icon-file">
          <span>Erase</span>
        </button>
        <button class="btn btn-save btn-combined" id="saveBtn" title="Save changes">
          <img src="UI/save.svg" alt="Save" class="btn-icon-file">
          <span>Save</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const SystemDetectors = {
      os: () => {
        const ua = navigator.userAgent;
        if (ua.includes("Win")) return "Windows";
        if (ua.includes("Mac")) return "macOS";
        if (ua.includes("Android")) return "Android";
        if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
        
        if (ua.includes("Ubuntu")) return "Ubuntu";
        if (ua.includes("Debian")) return "Debian";
        if (ua.includes("Fedora")) return "Fedora";
        if (ua.includes("Arch")) return "Arch";
        if (ua.includes("Mint")) return "Linux Mint";
        if (ua.includes("Linux")) return "Linux";
        
        return "Web OS";
      },
      browser: () => {
        const ua = navigator.userAgent;
        if (ua.includes("Firefox")) return "Firefox";
        if (ua.includes("Edg")) return "Microsoft Edge";
        if (ua.includes("Chrome")) return "Google Chrome";
        if (ua.includes("Safari")) return "Apple Safari";
        return "Web Browser";
      },
      gpu: () => {
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl');
          if (!gl) return "WebGL Not Supported";
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        } catch (e) { return "Generic WebGL"; }
      },
      cpu: () => {
        const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "";
        let vendor = "";

        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl');
          if (gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "";

            if (renderer.includes("Apple")) {
              vendor = "Apple Silicon";
            } else if (renderer.includes("Adreno")) {
              vendor = "Qualcomm Snapdragon";
            } else if (renderer.includes("Mali")) {
              vendor = "ARM / MediaTek / Exynos";
            } else if (renderer.includes("AMD") || renderer.includes("Radeon")) {
              vendor = "AMD Processor";
            } else if (renderer.includes("Intel")) {
              vendor = "Intel Processor";
            }
          }
        } catch(e) {}

        if (!vendor) {
          const ua = navigator.userAgent;
          if (ua.includes("Mac OS") || ua.includes("Macintosh")) {
            vendor = "Apple Silicon / Intel Mac";
          } else if (ua.includes("Android")) {
            vendor = "ARM Mobile";
          } else {
            vendor = "x86-64 (Intel / AMD)";
          }
        }

        return cores ? `${vendor} (${cores})` : vendor;
      },
      ram: () => navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : "N/A",
      screen: () => {
        const ratio = window.devicePixelRatio || 1;
        return `${Math.round(window.screen.width * ratio)}x${Math.round(window.screen.height * ratio)}`;
      },
      battery: async () => {
        if ('getBattery' in navigator) {
          try {
            const b = await navigator.getBattery();
            return `${Math.round(b.level * 100)}% ${b.charging ? '[Charging]' : ''}`;
          } catch(e) {}
        }
        return "Desktop / N/A";
      },
      uptime: () => {
        const sec = Math.floor(performance.now() / 1000);
        return `${Math.floor(sec / 60)}m ${sec % 60}s`;
      }
    };

    function generateAutoConfig() {
      return {
        "title": "user@webfetch",
        "logo": "auto",
        "keyColor": "var(--accent)",
        "valColor": "var(--text-main)",
        "logoColors": [
          "#1d1f21", "#cc6666", "#b5bd68", "#f0c674",
          "#81a2be", "#b294bb", "#8abeb7", "#c5c8c6"
        ],
        "modules": [
          { "type": "os", "key": "OS" },
          { "type": "browser", "key": "Browser" },
          { "type": "gpu", "key": "GPU" },
          { "type": "cpu", "key": "CPU" },
          { "type": "ram", "key": "Memory" },
          { "type": "screen", "key": "Resolution" },
          { "type": "battery", "key": "Battery" },
          { "type": "uptime", "key": "Uptime" },
          { "type": "colors" }
        ]
      };
    }

    function parseLogoColors(str, config = {}) {
      if (!str) return '';

      const defaultColors = [
        "#1d1f21", "#cc6666", "#b5bd68", "#f0c674",
        "#81a2be", "#b294bb", "#8abeb7", "#c5c8c6"
      ];
      const userColors = Array.isArray(config.logoColors) ? config.logoColors : [];

      let html = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      html = html.replace(/\$([1-9])/g, (match, num) => {
        const index = parseInt(num, 10) - 1;
        const color = userColors[index] || defaultColors[index] || '#c5c8c6';
        return `</span><span style="color: ${color};">`;
      });

      return `<span>${html}</span>`;
    }

    const themeStyleElem = document.getElementById('themeStyle');
    const themeSelect = document.getElementById('themeSelect');
    const windowStyleSelect = document.getElementById('windowStyleSelect');
    const webfetchWindow = document.getElementById('webfetchWindow');
    const windowHeader = document.getElementById('windowHeader');

    function updateButtonTextColor() {
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.style.setProperty('--btn-text-color', isDark ? '#ffffff' : '#000000');
    }

    function applyTheme(themeName) {
      themeStyleElem.setAttribute('href', `themes/${themeName}.css`);
      localStorage.setItem('webfetch_theme', themeName);
      themeSelect.value = themeName;
      setTimeout(updateButtonTextColor, 50);
    }

    function applyWindowStyle(style) {
      webfetchWindow.className = `webfetch-window window-style-${style}`;
      localStorage.setItem('webfetch_window_style', style);
      windowStyleSelect.value = style;

      if (style === 'macos') {
        windowHeader.style.paddingLeft = "15px";
        windowHeader.innerHTML = `
          <div class="mac-dots">
            <div class="mac-dot dot-red"></div>
            <div class="mac-dot dot-yellow"></div>
            <div class="mac-dot dot-green"></div>
          </div>
          <span style="font-size: 12px; opacity: 0.6;" class="mac-title-spacing">WebFetch</span>
          <button class="menu-btn mac-btn-spacing" onclick="openModal()" title="Settings">⋮</button>
        `;
      } else if (style === 'windows') {
        windowHeader.style.paddingLeft = "15px";
        windowHeader.innerHTML = `
          <div style="display:flex; align-items:center;">
            <span style="font-size: 12px;">WebFetch</span>
          </div>
          <div style="display:flex; align-items:center; height:100%; gap: 5px;">
            <button class="menu-btn" onclick="openModal()" title="Settings">⋮</button>
            <div class="win-controls">
              <div class="win-btn" title="Minimize">—</div>
              <div class="win-btn" title="Maximize">▢</div>
              <div class="win-btn close" title="Close">✕</div>
            </div>
          </div>
        `;
      } else {
        windowHeader.innerHTML = '';
      }
    }

    async function renderTerminal(config) {
      const logoBox = document.getElementById('logoBox');
      const infoBox = document.getElementById('infoBox');
      const detectedOS = SystemDetectors.os();

      let finalLogo = "";
      if (!config.logo || config.logo === "auto") {
        finalLogo = getLogoForOS(detectedOS);
      } else if (typeof getLogoForOS === "function" && OS_LOGOS[config.logo.toLowerCase()]) {
        finalLogo = getLogoForOS(config.logo);
      } else {
        finalLogo = config.logo;
      }

      logoBox.innerHTML = `<pre>${parseLogoColors(finalLogo, config)}</pre>`;

      const globalKeyColor = config.keyColor || 'var(--accent)';
      const globalValColor = config.valColor || 'var(--text-main)';

      let html = '';
      if (config.title) {
        html += `<div class="title-line">${config.title}</div>`;
        html += `<div class="separator">${'-'.repeat(config.title.length + 4)}</div>`;
      }

      if (Array.isArray(config.modules)) {
        for (const mod of config.modules) {
          if (mod.type === 'colors') {
            const blocks = mod.colors || [
              '#1d1f21', '#cc6666', '#b5bd68', '#f0c674',
              '#81a2be', '#b294bb', '#8abeb7', '#c5c8c6'
            ];
            html += `<div class="color-blocks">`;
            blocks.forEach(c => { html += `<div class="block" style="background: ${c}"></div>`; });
            html += `</div>`;
            continue;
          }

          let val = mod.value;
          if (!val && SystemDetectors[mod.type]) {
            val = await SystemDetectors[mod.type]();
          } else if (!val) {
            val = "N/A";
          }

          const label = mod.key || (mod.type ? mod.type.toUpperCase() : "Info");
          const itemKeyColor = mod.keyColor || globalKeyColor;
          const itemValColor = mod.valColor || globalValColor;

          html += `
            <div class="info-row">
              <span class="info-key" style="color: ${itemKeyColor};">${label}</span>
              <span class="info-val" style="color: ${itemValColor};">${val}</span>
            </div>`;
        }
      }
      infoBox.innerHTML = html;
    }

    const modal = document.getElementById('modalOverlay');
    const configInput = document.getElementById('configInput');

    function loadConfig() {
      const saved = localStorage.getItem('webfetch_config');
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return generateAutoConfig();
    }

    let currentConfig = loadConfig();

    function openModal() {
      configInput.value = JSON.stringify(currentConfig, null, 2);
      modal.classList.add('active');
    }

    function closeModal() { modal.classList.remove('active'); }

    const savedTheme = localStorage.getItem('webfetch_theme') || 'neutral';
    const savedStyle = localStorage.getItem('webfetch_window_style') || 'macos';

    updateButtonTextColor();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateButtonTextColor);

    applyTheme(savedTheme);
    applyWindowStyle(savedStyle);
    renderTerminal(currentConfig);

    themeSelect.onchange = (e) => applyTheme(e.target.value);
    windowStyleSelect.onchange = (e) => applyWindowStyle(e.target.value);

    document.getElementById('saveBtn').onclick = () => {
      try {
        const parsed = JSON.parse(configInput.value);
        currentConfig = parsed;
        localStorage.setItem('webfetch_config', JSON.stringify(parsed));
        renderTerminal(currentConfig);
        closeModal();
      } catch (err) {
        alert('JSON Error\n\nDetails: ' + err.message);
      }
    };

    document.getElementById('eraseBtn').onclick = () => {
      currentConfig = generateAutoConfig();
      localStorage.removeItem('webfetch_config');
      configInput.value = JSON.stringify(currentConfig, null, 2);
      renderTerminal(currentConfig);
    };

    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const fileInput = document.getElementById('fileInput');

    exportBtn.onclick = () => {
      try {
        const configText = configInput.value;
        JSON.parse(configText);
        const blob = new Blob([configText], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'webfetch_config.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Invalid JSON! Cannot export configuration.');
      }
    };

    importBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          configInput.value = JSON.stringify(parsed, null, 2);
          alert('Configuration imported into editor! Click "Save" to apply.');
        } catch (err) {
          alert('Error parsing JSON file. Make sure it has a valid format.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    const handles = webfetchWindow.querySelectorAll('.resize-handle');
    let currentResizer = null;
    let originalWidth = 0, originalHeight = 0, originalMouseX = 0, originalMouseY = 0;

    handles.forEach(handle => {
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        currentResizer = handle;
        const rect = webfetchWindow.getBoundingClientRect();
        originalWidth = rect.width;
        originalHeight = rect.height;
        originalMouseX = e.clientX;
        originalMouseY = e.clientY;
        window.addEventListener('mousemove', handleResize);
        window.addEventListener('mouseup', stopResize);
      });
    });

    function handleResize(e) {
      if (!currentResizer) return;
      const dx = e.clientX - originalMouseX;
      const dy = e.clientY - originalMouseY;
      const minW = 380, minH = 220;

      if (currentResizer.classList.contains('resizer-br')) {
        webfetchWindow.style.width = Math.max(minW, originalWidth + dx) + 'px';
        webfetchWindow.style.height = Math.max(minH, originalHeight + dy) + 'px';
      } else if (currentResizer.classList.contains('resizer-bl')) {
        webfetchWindow.style.width = Math.max(minW, originalWidth - dx) + 'px';
        webfetchWindow.style.height = Math.max(minH, originalHeight + dy) + 'px';
      } else if (currentResizer.classList.contains('resizer-tr')) {
        webfetchWindow.style.width = Math.max(minW, originalWidth + dx) + 'px';
        webfetchWindow.style.height = Math.max(minH, originalHeight - dy) + 'px';
      } else if (currentResizer.classList.contains('resizer-tl')) {
        webfetchWindow.style.width = Math.max(minW, originalWidth - dx) + 'px';
        webfetchWindow.style.height = Math.max(minH, originalHeight - dy) + 'px';
      }
    }

    function stopResize() {
      currentResizer = null;
      window.removeEventListener('mousemove', handleResize);
      window.removeEventListener('mouseup', stopResize);
    }
  </script>
</body>
</html>
